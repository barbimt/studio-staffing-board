services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: studio_capacity
    volumes:
      - studio_capacity_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d studio_capacity"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  studio_capacity_pgdata:
